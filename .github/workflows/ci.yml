name: CI
# Runs everything that does not need ROS 2 or a model: the fast test suite (validator, state machine, safety policy,
# approvals, no-fault-leak, timeouts, API, documentation links) and the dashboard type-check, lint and build.
# The 19 live-ROS tests and the benchmarks need a ROS 2 Lyrical install and Ollama; see docs/SETUP.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (Playwright is only needed by the UI harnesses)
        run: grep -v '^playwright' requirements.txt > /tmp/requirements-ci.txt && pip install -r /tmp/requirements-ci.txt
      - name: Fast tests
        run: python -m pytest tests -m "not ros" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
